name: relationship-network

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relationship_network}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-relationship}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:-relationship-network}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    restart: "no"

  api:
    build:
      context: ./backend
    command:
      - /bin/sh
      - -c
      - >-
        poetry run alembic upgrade head &&
        exec poetry run uvicorn relationship_network_api.main:create_app --factory --host 0.0.0.0 --port 8000 --proxy-headers
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RN_DATABASE_URL: ${RN_DATABASE_URL:?Set RN_DATABASE_URL in .env}
      RN_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      RN_OBJECT_STORAGE_BUCKET: ${MINIO_BUCKET:-relationship-network}
      RN_OBJECT_STORAGE_ENDPOINT: minio:9000
      RN_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      RN_OBJECT_STORAGE_SECURE: "false"
      RN_REDIS_URL: redis://redis:6379/0
      RN_SESSION_TTL_SECONDS: ${RN_SESSION_TTL_SECONDS:-1209600}
      RN_SESSION_RENEWAL_WINDOW_SECONDS: ${RN_SESSION_RENEWAL_WINDOW_SECONDS:-86400}
      RN_SESSION_COOKIE_SECURE: ${RN_SESSION_COOKIE_SECURE:-false}
      RN_INVITATION_TTL_SECONDS: ${RN_INVITATION_TTL_SECONDS:-604800}
      RN_MFA_CHALLENGE_TTL_SECONDS: ${RN_MFA_CHALLENGE_TTL_SECONDS:-300}
      RN_APP_BASE_URL: ${RN_APP_BASE_URL:-http://localhost:3000}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command:
      [
        "poetry",
        "run",
        "celery",
        "-A",
        "relationship_network_api.tasks:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
      ]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      RN_CELERY_BROKER_URL: redis://redis:6379/1
      RN_CELERY_RESULT_BACKEND: redis://redis:6379/2
      RN_SMTP_HOST: ${RN_SMTP_HOST:-}
      RN_SMTP_PORT: ${RN_SMTP_PORT:-587}
      RN_SMTP_USERNAME: ${RN_SMTP_USERNAME:-}
      RN_SMTP_PASSWORD: ${RN_SMTP_PASSWORD:-}
      RN_SMTP_FROM: ${RN_SMTP_FROM:-no-reply@relationship-network.local}
      RN_SMTP_USE_TLS: ${RN_SMTP_USE_TLS:-true}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "poetry run celery -A relationship_network_api.tasks:celery_app inspect ping --destination celery@$${HOSTNAME} --timeout 5",
        ]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  minio_data:
  postgres_data:
  redis_data:
