[project]
name = "relationship-network-api"
version = "0.1.0"
description = "Relationship Network commercial product API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "celery[redis]>=5.5,<6",
    "fastapi>=0.116,<1",
    "minio>=7.2,<8",
    "pydantic-settings>=2.10,<3",
    "redis>=6.2,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
    "anyio (==4.14)",
    "urllib3 (==2.7)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pypdf (>=5,<7)",
    "python-docx (>=1.1,<2)",
    "python-multipart (>=0.0.9,<1)",
    "httpx (>=0.28,<1)",
    "cryptography (>=45,<47)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
basedpyright = ">=1.31,<2"
httpx2 = "*"
pytest = ">=8.4,<9"
pytest-cov = ">=6.2,<7"
ruff = ">=0.12,<1"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
markers = ["integration: requires local infrastructure services"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
reportMissingTypeStubs = "none"
reportPrivateUsage = "none"
reportAny = "none"
reportFunctionMemberAccess = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUntypedFunctionDecorator = "none"
reportUninitializedInstanceVariable = "none"
reportUnusedFunction = "none"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    "D203",
    "D213",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "D", "PLR2004", "S101", "S105", "S106", "SLF001"]
"migrations/**/*.py" = ["S608"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"

[tool.coverage.run]
branch = true
source = ["src"]
